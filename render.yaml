# Render Blueprint for the BullMQ worker (the Next.js app goes on Vercel).
# Deployed as a free *web service* because Render background workers are paid; the worker
# exposes a /health endpoint on $PORT, which cron-job.org pings to keep the instance awake.
services:
  - type: web
    name: seo-audit-worker
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: node worker/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: USE_MOCKS
        value: "true"
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
